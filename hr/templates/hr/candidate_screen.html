{% extends 'hr/hr_base.html' %}

{% block title %}Candidate Screening — HR{% endblock %}

{% block content %}
<div class="page-header" style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color);">
    <h1 style="font-family: var(--font-display); font-size: 28px; font-weight: 800; margin-bottom: 4px;">Candidate Screening</h1>
    <p style="color: var(--text-muted); font-size: 14px;">Review applicants and process new recruitments.</p>
</div>

<div class="card" style="padding: 60px 20px; text-align: center;">
    <i data-lucide="briefcase" style="width: 48px; height: 48px; color: var(--text-light); margin-bottom: 16px;"></i>
    <h3>No Active Candidates</h3>
    <p style="color: var(--text-muted);">There are no pending applications in the pipeline currently.</p>
    <button class="btn btn-primary" style="margin-top: 16px;">Add Candidate</button>
</div>
{% endblock %}
